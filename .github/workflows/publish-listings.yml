name: Publish listings

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.12.2
        required: true

permissions:
  contents: write
  id-token: write

concurrency: publish-listings

jobs:
  publish:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release
        id: rel
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the release bundle
        run: |
          mkdir -p dist
          gh release download "${{ steps.rel.outputs.tag }}" --pattern 'mcpbrowser-*.mcpb' --dir dist
          ls -la dist

      - name: Point server.json at this release
        run: |
          python3 - "${{ steps.rel.outputs.tag }}" "${{ steps.rel.outputs.version }}" <<'EOF'
          import glob, hashlib, json, sys
          tag, version = sys.argv[1:3]
          bundle = glob.glob("dist/mcpbrowser-*.mcpb")[0]
          sha = hashlib.sha256(open(bundle, "rb").read()).hexdigest()
          doc = json.load(open("server.json"))
          doc["version"] = version
          pkg = doc["packages"][0]
          pkg["identifier"] = f"https://github.com/{'${{ github.repository }}'}/releases/download/{tag}/{bundle.split('/')[-1]}"
          pkg["fileSha256"] = sha
          json.dump(doc, open("server.json", "w"), indent=2)
          open("server.json", "a").write("\n")
          print(pkg["identifier"], sha)
          EOF

      - name: Commit server.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet server.json; then
            echo "server.json already current"
          else
            git add server.json
            git commit -m "Point the registry manifest at ${{ steps.rel.outputs.tag }}"
            git push
          fi

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_darwin_arm64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help | head -3

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          if ./mcp-publisher publish 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qiE 'already exists|duplicate' publish.log; then
            echo "version already in the registry, nothing to do"
            exit 0
          fi
          exit 1

      - name: Build the Smithery bundle
        run: python3 scripts/smithery-bundle.py dist/mcpbrowser-*.mcpb dist/smithery.mcpb

      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          npx -y @smithery/cli@4.11.1 mcp publish dist/smithery.mcpb -n bishwasbh/mcpbrowser
          python3 - <<'EOF'
          import json, os, urllib.request, zipfile
          manifest = json.loads(zipfile.ZipFile("dist/smithery.mcpb").read("manifest.json"))
          body = json.dumps({"displayName": "MCP Browser", "description": manifest["description"]}).encode()
          req = urllib.request.Request(
              "https://api.smithery.ai/servers/bishwasbh/mcpbrowser", data=body, method="PATCH",
              headers={
                  "Authorization": "Bearer " + os.environ["SMITHERY_API_KEY"],
                  "Content-Type": "application/json",
                  "User-Agent": "mcpbrowser-publish-listings",
              },
          )
          print(urllib.request.urlopen(req).read().decode())
          EOF
